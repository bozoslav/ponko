[package]
name = "ponko_bench"
default-run = "ponko_bench"
version = "0.1.0"
# A workspace tool, not a library: never published.
publish = false
description = "Benchmarks: ponko_ecs vs bevy_ecs vs hecs, and simulation at scale."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ponko_ecs = { path = "../../crates/ponko_ecs" }
ponko = { path = "../..", default-features = false, features = ["physics", "physics3d", "navmesh", "bench-internals"] }
rapier2d = "0.36.1"
rapier3d = "0.36.1"
rayon = "1.12.0"
# `multi_threaded` for `par_iter_mut`; `bevy_tasks` to start its thread pool.
bevy_ecs = { version = "0.20.1", features = ["multi_threaded"] }
bevy_tasks = { version = "0.20.1", features = ["multi_threaded"] }
hecs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The rendering baseline's report (the engine already depends on it).
serde_json = "1.0.154"

# The thread CPU clock of the streaming benchmark (wall time elsewhere).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
render = ["ponko/window"]
# The text benchmarks' shaped cases, and the ASCII case with shaping
# compiled in (its cost must match the build without it).
text-shaping = ["ponko/text-shaping"]

[[bin]]
name = "instances"
path = "src/bin/instances.rs"
required-features = ["render"]

[[bin]]
name = "characters"
path = "src/bin/characters.rs"

[[bin]]
name = "render_compare"
path = "src/bin/render_compare.rs"
